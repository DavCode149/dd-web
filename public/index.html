<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dd-web</title>
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/bare-mux.js"></script>
    <script defer src="/scramjet/scramjet.bundle.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <main class="app">
      <h1>dd-web</h1>
      <p>Experimental browser-like proxy shell powered by Scramjet.</p>
      <form id="proxy-form">
        <input id="url" type="url" placeholder="https://example.com" required />
        <button type="submit">Go</button>
      </form>
      <p class="hint">Enter a URL above to browse it through the proxy.</p>
    </main>
  </body>
</html>
