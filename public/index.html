<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dd-web</title>
    <link rel="stylesheet" href="/styles.css" />
    <!-- Load bare-mux and scramjet as plain scripts (NOT type="module") -->
    <script src="/bare-mux.js"></script>
    <script src="/scramjet/scramjet.all.js"></script>
    <script>
      const { ScramjetController } = $scramjetLoadController();
      window.__scramjet = new ScramjetController({
        prefix: "/scramjet/",
        files: {
          wasm: "/scramjet/scramjet.wasm.wasm",
          all:  "/scramjet/scramjet.all.js",
          sync: "/scramjet/scramjet.sync.js",
        },
        flags: {
          captureErrors: true,
          strictRewrites: true,
        },
      });
      window.__scramjet.init();
    </script>
    <script src="/epoxy.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <main class="app">
      <h1>dd-web</h1>
      <p>Experimental browser-like proxy shell powered by Scramjet.</p>
      <form id="proxy-form">
        <input id="url" type="url" placeholder="https://example.com" required />
        <button type="submit">Go</button>
      </form>
      <p class="hint">Enter a URL above to browse it through the proxy.</p>
    </main>
  </body>
</html>
